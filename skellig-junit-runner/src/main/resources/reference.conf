# Defaults of the Skellig JUnit runner. They apply even when the project has no configuration file,
# and can be overridden in the project configuration or with system properties,
# for example -Dskellig.parallel.mode=feature -Dskellig.parallel.threads=4
skellig.parallel {
    # How tests run in parallel: none | feature | scenario | tag
    mode = none
    # The maximum number of parallel groups which run at the same time, 0 means the number of processors
    threads = 0
    tag {
        # The ordered tags which form parallel groups in the mode 'tag'
        groups = []
        # A regular expression for tags which form parallel groups, an alternative to 'groups' which wins when both are set
        pattern = ""
        # What to do with a scenario which has several group tags: merge | first | fail
        on-multiple = merge
        # What to do with a scenario which has no group tag: shared-group | own-group | per-feature
        untagged = shared-group
    }
    # The tags of scenarios which run alone, after the parallel part of the run
    exclusive-tags = []
}
