# Runnable with UiScenarioIT's deterministic application; replace the base URL for your app.
ui {
  base-url = "http://localhost:8080"
  timeout = 30s
  browser {
    mode = local
    name = chrome
    headless = true
    window { width = 1280, height = 720 }
    timeouts { implicit = 0ms }
  }
  screenshots.path = "target/ui-screenshots"
  pages {
    login {
      path = "/login"
      elements {
        username = "//*[@id='username']"
        password = "//*[@id='password']"
        submit = "//*[@id='submit']"
      }
    }
    dashboard {
      path = "/dashboard"
      elements.account = "//*[@id='dashboard']"
    }
  }
}
